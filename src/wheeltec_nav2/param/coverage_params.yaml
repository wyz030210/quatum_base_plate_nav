# Indoor Ackermann coverage. Dimensions match the Nav2 rectangular footprint.
# These limits are not a substitute for steering-rate and tracking calibration.
coverage_server:
  ros__parameters:
    coordinates_in_cartesian_frame: true
    robot_width: 0.68
    robot_length: 0.88
    operation_width: 0.60
    # Centerline pitch is independent of the actual covered width.
    swath_spacing: 2.00
    # min_turning_radius: 0.95
    min_turning_radius: 0.80

    # Retained pending physical steering-rate measurement; not a verified limit.
    linear_curv_change: 200.0

    # Check the whole footprint and swept connections before returning a path.
    validate_path_bounds: true
    path_boundary_margin: 0.03

    default_allow_overlap: false
    default_headland_type: "CONSTANT"
    # 1.30 m kept centers inside a rectangle but let corners leave by 0.069 m.
    # 1.50 m is regression-tested with the 0.88 x 0.68 m footprint and margin.
    # This is reserved turning space; this pipeline does NOT cover the outer ring.
    default_headland_width: 1.50
    default_path_continuity_type: "CONTINUOUS"
    default_path_type: "DUBIN"
    default_route_type: "BOUSTROPHEDON"
    default_swath_angle_type: "SET_ANGLE"
    default_swath_angle: 1.57
    default_swath_type: "NUMBER"
    default_turn_point_distance: 0.05
