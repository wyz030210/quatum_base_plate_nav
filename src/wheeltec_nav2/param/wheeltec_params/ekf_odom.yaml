# ekf_odom.yaml - 第一层EKF（平滑FAST-LIO2）
/**:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    sensor_timeout: 0.5
    transform_timeout: 0.5

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    publish_tf: true

    # ----- FAST-LIO2（已融合IMU，使用完整位姿）-----
    odom0: /Odometry
    odom0_config: [true, true, false,      # x, y (位置)
                   false, false, true,     # yaw (姿态)
                   false, false, false,    # 不使用速度
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false                  # FAST-LIO2是绝对位姿
    odom0_pose_rejection_threshold: 9999.0

    # ----- 不要重复融合IMU！IMU已经在FAST-LIO2内部使用了 -----

