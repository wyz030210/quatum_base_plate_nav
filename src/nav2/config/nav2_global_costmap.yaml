global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0  # 更新频率1Hz
      publish_frequency: 1.0  # 发布频率1Hz
      global_frame: map  # 全局框架为地图
      robot_base_frame: base_link  # 机器人基座框架
      use_sim_time: True  # 使用仿真时间
      robot_radius: 0.12  # 机器人半径
      resolution: 0.05  # 分辨率
      track_unknown_space: true  # 跟踪未知空间
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]  # 插件列表：静态层、障碍物层、膨胀层
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"  # 障碍物层插件
        enabled: True  # 启用障碍物层
        observation_sources: scan  # 观察源：激光扫描
        scan:
          topic: /scan  # 激光扫描话题
          max_obstacle_height: 2.0  # 最大障碍物高度
          clearing: True  # 是否清除障碍物
          marking: True  # 是否标记障碍物
          data_type: "LaserScan"  # 数据类型
          raytrace_max_range: 3.0  # 光线追踪最大范围
          raytrace_min_range: 0.0  # 光线追踪最小范围
          obstacle_max_range: 2.5  # 障碍物最大范围
          obstacle_min_range: 0.0  # 障碍物最小范围
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"  # 静态层插件
        map_subscribe_transient_local: True  # 地图订阅使用瞬态本地传输
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"  # 膨胀层插件
        cost_scaling_factor: 3.0  # 成本缩放因子
        inflation_radius: 0.5  # 膨胀半径0.5米
      always_send_full_costmap: True  # 总是发送完整代价地图

map_server:
  ros__parameters:
    use_sim_time: True  # 使用仿真时间
    yaml_filename: ""  # YAML地图文件路径（通常在启动文件中覆盖）
    
map_saver:
  ros__parameters:
    use_sim_time: True  # 使用仿真时间
    save_map_timeout: 5.0  # 保存地图超时时间（秒）
    free_thresh_default: 0.25  # 自由阈值默认值
    occupied_thresh_default: 0.65  # 占用阈值默认值
    map_subscribe_transient_local: True  # 地图订阅使用瞬态本地传输
