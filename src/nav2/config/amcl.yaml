amcl:
  ros__parameters:
    use_sim_time: True  # 使用仿真时间，而不是系统时间
    alpha1: 0.2  # 运动模型中的旋转噪声参数（从旋转中估计的旋转）
    alpha2: 0.2  # 运动模型中的旋转噪声参数（从平移中估计的旋转）
    alpha3: 0.2  # 运动模型中的平移噪声参数（从旋转中估计的平移）
    alpha4: 0.2  # 运动模型中的平移噪声参数（从平移中估计的平移）
    alpha5: 0.2  # 运动模型中的最终旋转噪声参数（仅用于Omni方向轮机器人）
    base_frame_id: "base_footprint"  # 机器人基座框架的ID
    beam_skip_distance: 0.5  # 光束跳过距离，用于处理激光扫描中的动态障碍物
    beam_skip_error_threshold: 0.9  # 光束跳过错误阈值
    beam_skip_threshold: 0.3  # 光束跳过阈值
    do_beamskip: false  # 是否启用光束跳过功能
    global_frame_id: "map"  # 全局地图框架的ID
    lambda_short: 0.1  # 激光模型中的短距离权重
    laser_likelihood_max_dist: 2.0  # 激光似然场最大距离
    laser_max_range: 100.0  # 激光最大范围
    laser_min_range: -1.0  # 激光最小范围（-1.0表示使用传感器报告的值）
    laser_model_type: "likelihood_field"  # 激光模型类型，这里使用似然场模型
    max_beams: 60  # 处理激光扫描时最大光束数（减少计算量）
    max_particles: 2000  # 粒子滤波器的最大粒子数
    min_particles: 500  # 粒子滤波器的最小粒子数
    odom_frame_id: "odom"  # 里程计框架的ID
    pf_err: 0.05  # 粒子滤波器的错误阈值
    pf_z: 0.99  # 粒子滤波器的z值（用于重采样）
    recovery_alpha_fast: 0.0  # 快速恢复alpha值
    recovery_alpha_slow: 0.0  # 慢速恢复alpha值
    resample_interval: 1  # 重采样间隔（每n次更新重采样一次）
    robot_model_type: "nav2_amcl::DifferentialMotionModel"  # 机器人运动模型类型，这里为差分驱动模型
    save_pose_rate: 0.5  # 保存姿态的速率（Hz）
    sigma_hit: 0.2  # 激光模型的命中噪声标准差
    tf_broadcast: true  # 是否广播TF变换
    transform_tolerance: 1.0  # 变换容差（秒）
    update_min_a: 0.2  # 最小角度变化（弧度）触发更新
    update_min_d: 0.25  # 最小距离变化（米）触发更新
    z_hit: 0.5  # 激光模型中命中测量的权重
    z_max: 0.05  # 激光模型中最大范围测量的权重
    z_rand: 0.5  # 激光模型中随机测量的权重
    z_short: 0.05  # 激光模型中短范围测量的权重
    scan_topic: scan  # 激光扫描话题的名称
