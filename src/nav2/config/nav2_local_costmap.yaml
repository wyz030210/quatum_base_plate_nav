local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0  # 更新频率5Hz
      publish_frequency: 2.0  # 发布频率2Hz
      global_frame: odom  # 全局框架为odom（本地代价地图基于里程计）
      robot_base_frame: base_link  # 机器人基座框架
      use_sim_time: True  # 使用仿真时间
      rolling_window: true  # 滚动窗口，代价地图随机器人移动
      width: 3  # 宽度3米
      height: 3  # 高度3米
      resolution: 0.05  # 分辨率0.05米/像素
      robot_radius: 0.12  # 机器人半径0.12米
      plugins: ["voxel_layer", "inflation_layer"]  # 插件列表，体素层和膨胀层
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"  # 膨胀层插件
        cost_scaling_factor: 3.0  # 成本缩放因子
        inflation_radius: 0.5  # 膨胀半径0.5米
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"  # 体素层插件
        enabled: True  # 启用体素层
        publish_voxel_map: True  # 发布体素地图
        origin_z: 0.0  # 原点z坐标
        z_resolution: 0.05  # z分辨率0.05米
        z_voxels: 16  # z方向体素数
        max_obstacle_height: 2.0  # 最大障碍物高度2.0米
        mark_threshold: 0  # 标记阈值
        observation_sources: scan  # 观察源：激光扫描
        scan:
          topic: /scan  # 激光扫描话题
          max_obstacle_height: 2.0  # 最大障碍物高度
          clearing: True  # 是否清除障碍物
          marking: True  # 是否标记障碍物
          data_type: "LaserScan"  # 数据类型
          raytrace_max_range: 3.0  # 光线追踪最大范围
          raytrace_min_range: 0.0  # 光线追踪最小范围
          obstacle_max_range: 2.5  # 障碍物最大范围
          obstacle_min_range: 0.0  # 障碍物最小范围
      static_layer:  # 静态层参数（但plugins中未包含，可能未启用）
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True  # 总是发送完整代价地图
