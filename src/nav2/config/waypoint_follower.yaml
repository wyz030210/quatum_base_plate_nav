waypoint_follower:
  ros__parameters:
    use_sim_time: True  # 使用仿真时间
    loop_rate: 20  # 循环速率20Hz
    stop_on_failure: false  # 失败时是否停止
    waypoint_task_executor_plugin: "wait_at_waypoint"  # 路径点任务执行器插件
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"  # 插件类型
      enabled: True  # 是否启用
      waypoint_pause_duration: 200  # 等待时间200毫秒
