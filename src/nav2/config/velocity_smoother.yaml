velocity_smoother:
  ros__parameters:
    use_sim_time: True  # 使用仿真时间
    smoothing_frequency: 20.0  # 平滑频率20Hz
    scale_velocities: False  # 是否缩放速度
    feedback: "OPEN_LOOP"  # 反馈类型，开环
    max_velocity: [0.26, 0.0, 1.0]  # 最大速度[x, y, theta]（米/秒，弧度/秒）
    min_velocity: [-0.26, 0.0, -1.0]  # 最小速度
    max_accel: [2.5, 0.0, 3.2]  # 最大加速度
    max_decel: [-2.5, 0.0, -3.2]  # 最大减速度
    odom_topic: "odom"  # 里程计话题
    odom_duration: 0.1  # 里程计持续时间（秒）
    deadband_velocity: [0.0, 0.0, 0.0]  # 死区速度
    velocity_timeout: 1.0  # 速度超时时间（秒）
